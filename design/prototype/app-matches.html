<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hawks App — Matches</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="proto-bar"><div class="wrap"><span>Prototype · Player app · Matches</span><span><a href="index.html">Website</a> · <button class="btn-ghost-light btn btn-sm" style="min-height:32px" onclick="hawksToggleTheme()">Theme</button></span></div></div>
<div class="proto-stage">
<div class="phone">
  <header class="app-header">
    <h1>Matches</h1>
    <a class="btn btn-ghost btn-sm" href="app-stats.html"><svg class="i i-sm" aria-hidden="true"><use href="#i-chart"/></svg> Stats</a>
  </header>

  <div class="app-scroll">
    <section id="p-fx">
      <div class="block-head" style="margin-top:8px"><h2>Next match</h2><span class="synced" id="sync-line">Loading…</span></div>
      <div id="next"><div class="skeleton" style="height:180px"></div></div>

      <div class="block-head" style="margin-top:20px"><h2 id="season-h">Season fixtures</h2><span class="muted" id="season-count" style="font-size:13px"></span></div>
      <div class="card" style="padding:0 16px" id="season"><div class="skeleton" style="height:200px;margin:14px 0"></div></div>
      <p class="muted source-note">Fixtures and results from the SCA team pages (CSV export). Availability is a prototype interaction and isn't saved.</p>
    </section>

  </div>

  <nav class="tabbar" aria-label="App">
    <a href="app-home.html"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg>Home</a>
    <a href="app-matches.html" aria-current="page"><svg class="i" aria-hidden="true"><use href="#i-calendar"/></svg>Matches</a>
    <a href="app-stats.html"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg>Stats</a>
    <a href="app-money.html"><svg class="i" aria-hidden="true"><use href="#i-wallet"/></svg>Money</a>
    <a href="#"><svg class="i" aria-hidden="true"><use href="#i-menu"/></svg>More</a>
  </nav>
</div>
</div>
<script src="icons.js"></script>
<script src="data/sca-snapshot.js"></script>
<script src="sca-api.js"></script>
<script>
(function () {
  var A = HawksApi, esc = A.esc, T = A.teamName, $ = function (id) { return document.getElementById(id); };
  var empty = function (m) { return '<div class="empty-note"><svg class="i" aria-hidden="true"><use href="#i-hourglass"/></svg><span>' + esc(m) + '</span></div>'; };
  var short = function (c) { return (c || 'SCA').replace(/ - \d{4}$/, '').replace('SCA Clubs ', 'SCA '); };

  function nextCard(f) {
    if (!f) return '<div class="card">' + empty('No upcoming matches in the SCA schedule.') + '</div>';
    var opp = A.opponent(f), ko = A.kickoff(f), days = ko ? Math.ceil((ko - Date.now()) / 864e5) : null;
    var maps = f.venue ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(f.venue + ' Singapore') : null;
    return '<article class="card next-match">' +
      '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="chip chip-navy">' + esc(short(f.competition)) + '</span>' +
      (days != null && days >= 0 ? '<span class="status status-info"><svg class="i i-sm" aria-hidden="true"><use href="#i-clock"/></svg> ' + (days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : 'In ' + days + ' days') + '</span>' : '') + '</div>' +
      '<div class="teams"><div class="t"><span class="mini-crest"><img src="hawks-logo.jpg" alt=""></span>Hawks</div><span class="vs" style="font-size:16px">' + (A.isUs(f.teamOne) ? 'VS' : '@') + '</span>' +
      '<div class="t" style="text-align:right">' + esc(T(opp)) + '<span class="mini-crest away" aria-hidden="true">' + esc(A.crestText(opp)) + '</span></div></div>' +
      '<div class="meta-row"><span><svg class="i i-sm" aria-hidden="true"><use href="#i-calendar"/></svg> ' + A.niceDate(f.date, f.dateText) + (f.time ? ' · ' + esc(f.time) : '') + '</span>' +
      (f.venue ? '<span><svg class="i i-sm" aria-hidden="true"><use href="#i-map"/></svg> ' + esc(f.venue) + '</span>' : '') + '</div>' +
      '<div class="seg" role="group" aria-label="Your availability"><button data-v="yes" aria-pressed="false"><svg class="i i-sm" aria-hidden="true"><use href="#i-check"/></svg> Available</button>' +
      '<button data-v="maybe" aria-pressed="false"><svg class="i i-sm" aria-hidden="true"><use href="#i-help"/></svg> Maybe</button>' +
      '<button data-v="no" aria-pressed="false"><svg class="i i-sm" aria-hidden="true"><use href="#i-x"/></svg> Out</button></div>' +
      (maps ? '<div style="display:flex;gap:8px;margin-top:12px"><a class="btn btn-ghost btn-sm" href="' + esc(maps) + '" target="_blank" rel="noopener"><svg class="i i-sm" aria-hidden="true"><use href="#i-map"/></svg> Directions</a></div>' : '') +
      '</article>';
  }

  function seasonList(fixtures, results) {
    var byKey = {};
    results.forEach(function (m) { byKey[m.date + '|' + (A.opponent(m) || '').toUpperCase()] = m; });
    var today = new Date().toISOString().slice(0, 10);
    var rows = fixtures.slice().sort(function (a, b) { return (a.date || '9999').localeCompare(b.date || '9999'); });
    return rows.map(function (f) {
      var m = byKey[f.date + '|' + (A.opponent(f) || '').toUpperCase()];
      var past = f.date && f.date < today;
      var hawksScore = m && (A.isUs(m.teamOne) ? m.teamOneScore : m.teamTwoScore);
      var oppScore = m && (A.isUs(m.teamOne) ? m.teamTwoScore : m.teamOneScore);
      var label = { WON: ['status-ok', 'W'], LOST: ['status-bad', 'L'], ABANDONED: ['status-info', 'A'], TIED: ['status-info', 'T'], NO_RESULT: ['status-info', 'NR'] }[m && m.outcome];
      var sub = [A.niceDate(f.date, f.dateText, { day: 'numeric', month: 'short', year: 'numeric' }), esc(f.venue)].filter(Boolean).join(' · ');
      if (hawksScore || oppScore) sub = esc((hawksScore || '—') + ' v ' + (oppScore || '—')) + ' · ' + sub;
      return '<div class="list-row"><div class="grow"><div class="title">' + (A.isUs(f.teamOne) ? 'vs ' : '@ ') + esc(T(A.opponent(f))) + '</div><div class="sub">' + sub + '</div>' +
        (m && m.result ? '<div class="sub">' + esc(m.result) + '</div>' : '') + '</div>' +
        (label ? '<span class="status ' + label[0] + '" title="' + esc(m.outcome) + '">' + label[1] + '</span>'
               : past ? '<span class="status status-info" title="Not listed in the SCA results export">Not in results</span>' : '<span class="status status-warn">Upcoming</span>') + '</div>';
    }).join('');
  }

  Promise.all([A.get('/api/sca/schedule/next'), A.get('/api/sca/schedule?includePast=true'), A.get('/api/sca/results')]).then(function (r) {
    $('next').innerHTML = nextCard(r[0].data);
    var fixtures = r[1].data || [];
    $('season-h').textContent = fixtures.length && fixtures[0].competition ? short(fixtures[0].competition) : 'Season fixtures';
    $('season-count').textContent = fixtures.length ? fixtures.length + ' matches' : '';
    $('season').innerHTML = fixtures.length ? seasonList(fixtures, r[2].data || []) : empty('No fixtures synced yet.');
    $('sync-line').textContent = A.syncInfo({ sources: r[1].meta.sources }).text;
  }).catch(function (e) {
    $('sync-line').textContent = 'Unavailable';
    $('next').innerHTML = '<div class="card">' + empty('Fixtures are unavailable right now (' + e.message + ').') + '</div>';
    $('season').innerHTML = empty('Unavailable');
  });

  document.addEventListener('click', function (e) {
    var b = e.target.closest('.seg button'); if (!b) return;
    b.parentElement.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    hawksToast('Availability saved: ' + b.textContent.trim());
  });
})();
</script>
</body>
</html>
