# Server profile. All secrets come from environment variables (see deploy/.env.example).
spring:
  # Any SMTP provider (e.g. Brevo). Until these are set, invites fail and admins see why.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

logging:
  structured:
    format:
      console: ecs

hawks:
  cors:
    # The deployed web app's origin, e.g. https://app.example.org (comma-separated)
    allowed-origins: ${HAWKS_CORS_ALLOWED_ORIGINS:}
