# Temporary: prints the dependency set Expo's official templates use today, so the
# app's package.json can match it exactly. Removed once apps/mobile is created.
name: expo-probe
on:
  push:
    branches: [claude/spring-boot-backend]
    paths: ['.github/workflows/expo-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Default (Expo Router) template
        run: |
          npx --yes create-expo-app@latest probe-default --template default --no-install
          echo "=== package.json"; cat probe-default/package.json
          echo "=== app.json"; cat probe-default/app.json
          echo "=== tsconfig.json"; cat probe-default/tsconfig.json
          echo "=== files"; find probe-default -type f -not -path '*/node_modules/*' -not -path '*/.git/*' | sort
          echo "=== app layout"; find probe-default -path '*app/_layout.tsx' -exec cat {} \;
          echo "=== tabs layout"; find probe-default -path '*(tabs)/_layout.tsx' -exec cat {} \;
      - name: Versions
        run: |
          for p in expo expo-router react react-native react-dom react-native-web typescript @types/react; do
            echo "$p: $(npm view $p version)"; done
          npm view expo dist-tags
